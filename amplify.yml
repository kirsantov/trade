version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "-- Starting preBuild frontend phase"
        - npm install
    build:
      commands:
        - echo "-- Starting build phase"
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
