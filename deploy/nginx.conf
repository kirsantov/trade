# Single Window - nginx configuration
# Поместить в /etc/nginx/sites-available/tradekg

upstream nextjs {
    server 127.0.0.1:3000;
    keepalive 8;
}

# Редирект HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name trade.kg www.trade.kg;
    
    # Let's Encrypt challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    
    # Редирект всего остального на HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# Основной HTTPS сервер
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trade.kg www.trade.kg;
    
    # SSL сертификаты
    ssl_certificate /etc/letsencrypt/live/trade.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trade.kg/privkey.pem;
    
    # SSL настройки безопасности
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 10m;
    ssl_session_cache shared:SSL:10m;
    ssl_buffer_size 8k;
    
    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    
    # Дополнительные заголовки безопасности
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    
    # Основные настройки
    root /var/www/tradekg;
    index index.html;
    client_max_body_size 10M;
    
    # Логирование
    access_log /var/log/nginx/tradekg_access.log;
    error_log /var/log/nginx/tradekg_error.log;
    
    # Gzip компрессия
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private must-revalidate auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml+rss
        application/javascript
        application/json
        image/svg+xml;
    
    # Кеширование статических файлов
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri @nextjs;
    }
    
    # Специальное кеширование для _next статики
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri @nextjs;
    }
    
    # Статические файлы в public
    location /i/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri @nextjs;
    }
    
    # API маршруты - без кеширования
    location /api/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
    }
    
    # Основное приложение Next.js
    location / {
        try_files $uri @nextjs;
    }
    
    # Проксирование на Next.js сервер
    location @nextjs {
        proxy_pass http://nextjs;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400;
        
        # Буферизация ответов
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
    
    # Health check для мониторинга
    location /health {
        proxy_pass http://nextjs/api/health;
        access_log off;
    }
    
    # Блокировка доступа к служебным файлам
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    location ~ ^/(\.user\.ini|\.htaccess|\.htpasswd|\.svn|\.bzr|\.git) {
        deny all;
        access_log off;
        log_not_found off;
    }
}

# Дополнительный блок для редиректа www → без www (опционально)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.trade.kg;
    
    ssl_certificate /etc/letsencrypt/live/trade.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trade.kg/privkey.pem;
    
    return 301 https://trade.kg$request_uri;
}